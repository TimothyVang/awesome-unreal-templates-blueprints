name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Markdown, Anchor & URL Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog structure, tables, anchors, and URLs
        run: python3 scripts/validate_catalog.py
