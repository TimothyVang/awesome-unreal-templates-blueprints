name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Markdown, Anchor & URL Hygiene Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate catalog structure, tables, anchors, and URLs
        run: python3 scripts/validate_catalog.py
